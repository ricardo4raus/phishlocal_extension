<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhishLocal</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <h1>PhishLocal</h1>
      <p id="model-status" class="model-status" role="status"></p>

      <section class="email" aria-labelledby="email-heading">
        <h2 id="email-heading">Email</h2>
        <button id="read-email" type="button">Read open email</button>
        <p id="email-status" class="email-status" role="status"></p>
        <dl id="email-details" class="email-details" hidden>
          <dt>From</dt>
          <dd id="email-sender"></dd>
          <dt>Subject</dt>
          <dd id="email-subject"></dd>
          <dt>Links</dt>
          <dd><ul id="email-links"></ul></dd>
          <dt>Text</dt>
          <dd id="email-body" class="email-body"></dd>
        </dl>
      </section>

      <h2>Test prompt</h2>
      <label for="prompt">Prompt (test text only, no real emails)</label>
      <textarea id="prompt" rows="6">
Is this email suspicious? Answer in two sentences.

"Your account is locked. Confirm your password within 24 hours: http://paypa1-secure.com/login"</textarea>

      <label id="force-cloud-row" class="checkbox" hidden>
        <input id="force-cloud" type="checkbox" />
        Force cloud (development only)
      </label>

      <button id="run" type="button">Run prompt</button>

      <p id="status" role="status"></p>
      <pre id="output"></pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
