name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref. Superseded PR runs are cancelled; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening); the comment
      # holds the release tag so Dependabot/Renovate can bump both together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no install scripts are needed, so none get to run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # format:check -> lint -> typecheck -> build -> test
      # No secrets needed: the build works with empty VITE_FIREBASE_* values.
      - name: Run checks
        run: npm run check
